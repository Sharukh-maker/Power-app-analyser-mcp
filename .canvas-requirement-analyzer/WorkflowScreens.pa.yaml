                                    Height: =48
                                    Size: =12
                                    Text: ="No stories to review yet. Run the analysis flow on an uploaded requirement."
                                    Width: =Parent.Width
                        - TestsCard:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              Fill: =RGBA(255, 255, 255, 1)
                              FillPortions: =1
                              LayoutAlignItems: =LayoutAlignItems.Start
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =8
                              LayoutMinHeight: =160
                              LayoutMinWidth: =250
                              PaddingBottom: =16
                              PaddingLeft: =16
                              PaddingRight: =16
                              PaddingTop: =16
                              RadiusBottomLeft: =10
                              RadiusBottomRight: =10
                              RadiusTopLeft: =10
                              RadiusTopRight: =10
                              DropShadow: =DropShadow.Light
                            Children:
                              - TestsTitle:
                                  Control: Text
                                  Properties:
                                    FontColor: =RGBA(23, 35, 58, 1)
                                    Height: =26
                                    Size: =15
                                    Text: ="UAT test cases"
                                    Weight: =FontWeight.Semibold
                                    Width: =Parent.Width
                              - TestsEmpty:
                                  Control: Text
                                  Properties:
                                    AutoHeight: =true
                                    FontColor: =RGBA(91, 102, 122, 1)
                                    Height: =48
                                    Size: =12
                                    Text: ="Generated test cases and requirement traceability will appear here after analysis."
                                    Width: =Parent.Width
                        - RisksCard:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              Fill: =RGBA(255, 255, 255, 1)
                              FillPortions: =1
                              LayoutAlignItems: =LayoutAlignItems.Start
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =8
                              LayoutMinHeight: =160
                              LayoutMinWidth: =250
                              PaddingBottom: =16
                              PaddingLeft: =16
                              PaddingRight: =16
                              PaddingTop: =16
                              RadiusBottomLeft: =10
                              RadiusBottomRight: =10
                              RadiusTopLeft: =10
                              RadiusTopRight: =10
                              DropShadow: =DropShadow.Light
                            Children:
                              - RisksTitle:
                                  Control: Text
                                  Properties:
                                    FontColor: =RGBA(23, 35, 58, 1)
                                    Height: =26
                                    Size: =15
                                    Text: ="Risks & estimates"
                                    Weight: =FontWeight.Semibold
                                    Width: =Parent.Width
                              - RisksEmpty:
                                  Control: Text
