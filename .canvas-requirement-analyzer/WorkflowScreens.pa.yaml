                                    AutoHeight: =true
                                    FontColor: =RGBA(91, 102, 122, 1)
                                    Height: =48
                                    Size: =12
                                    Text: ="Ambiguities, dependencies, and story-point estimates will be shown for review."
                                    Width: =Parent.Width
                  - ReviewActions:
                      Control: GroupContainer
