Screens:
  Review:
    Properties:
      Fill: =RGBA(245, 246, 248, 1)
      LoadingSpinnerColor: =RGBA(14, 122, 107, 1)
    Children:
      - ReviewShell:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            Fill: =RGBA(245, 246, 248, 1)
            Height: =Parent.Height
            Width: =Parent.Width
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            LayoutOverflowY: =LayoutOverflow.Scroll
          Children:
            - ReviewNav:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  Fill: =RGBA(255, 255, 255, 1)
                  FillPortions: =0
                  Height: =60
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =8
                  LayoutMinHeight: =56
                  LayoutMinWidth: =280
                  PaddingLeft: =16
                  PaddingRight: =16
                Children:
                  - ReviewBrand:
                      Control: Text
                      Properties:
                        FontColor: =RGBA(23, 35, 58, 1)
                        Height: =36
                        Size: =15
                        Text: ="Requirement Analyzer"
                        Weight: =FontWeight.Semibold
                        Width: =210
                  - ReviewNavUpload:
                      Control: ModernButton
                      Properties:
                        AccessibleLabel: ="Open upload requirements"
                        Appearance: =ButtonAppearance.Subtle
                        Height: =38
                        Icon: ="ArrowUpload"
                        OnSelect: =Navigate(Upload, ScreenTransition.Fade)
                        Text: ="Upload"
                        Width: =100
                  - ReviewNavCurrent:
                      Control: ModernButton
                      Properties:
                        AccessibleLabel: ="Review artifacts, current page"
                        Appearance: =ButtonAppearance.Primary
                        Height: =38
                        Icon: ="CheckmarkCircle"
                        Text: ="Review"
                        Width: =100
                  - ReviewNavJira:
                      Control: ModernButton
                      Properties:
                        AccessibleLabel: ="Open Jira and sprint"
                        Appearance: =ButtonAppearance.Subtle
                        Height: =38
                        Icon: ="Link"
                        OnSelect: =Navigate(JiraSprint, ScreenTransition.Fade)
                        Text: ="Jira & sprint"
                        Width: =124
                  - ReviewNavDashboard:
                      Control: ModernButton
                      Properties:
                        AccessibleLabel: ="Open dashboard"
                        Appearance: =ButtonAppearance.Subtle
                        Height: =38
                        Icon: ="DataBarVertical"
                        OnSelect: =Navigate(Dashboard, ScreenTransition.Fade)
                        Text: ="Dashboard"
                        Width: =116
            - ReviewContent:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  FillPortions: =1
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =14
                  LayoutMinHeight: =300
                  LayoutMinWidth: =280
                  LayoutOverflowY: =LayoutOverflow.Scroll
                  PaddingBottom: =24
                  PaddingLeft: =If(App.Width < 720, 16, 28)
                  PaddingRight: =If(App.Width < 720, 16, 28)
                  PaddingTop: =22
                Children:
                  - ReviewTitle:
                      Control: Text
                      Properties:
                        FontColor: =RGBA(23, 35, 58, 1)
                        Height: =36
                        Size: =24
                        Text: ="Review generated artifacts"
                        Weight: =FontWeight.Semibold
                        Width: =Parent.Width
                  - ReviewSubtitle:
                      Control: Text
                      Properties:
                        FontColor: =RGBA(91, 102, 122, 1)
                        Height: =26
                        Size: =12
                        Text: ="Review and approve stories, acceptance criteria, test cases, risks, and estimates before Jira."
                        Width: =Parent.Width
                  - ReviewNotice:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        Fill: =RGBA(253, 240, 220, 1)
                        FillPortions: =0
                        Height: =86
                        LayoutAlignItems: =LayoutAlignItems.Start
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =6
                        LayoutMinHeight: =80
                        LayoutMinWidth: =260
                        PaddingBottom: =14
                        PaddingLeft: =16
                        PaddingRight: =16
                        PaddingTop: =14
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                      Children:
                        - ReviewNoticeTitle:
                            Control: Text
                            Properties:
                              FontColor: =RGBA(126, 66, 5, 1)
                              Height: =22
                              Size: =13
                              Text: ="No analysis is available"
                              Weight: =FontWeight.Semibold
                              Width: =Parent.Width
