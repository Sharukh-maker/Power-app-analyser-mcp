                            Control: ModernText
                            Properties:
                              AccessibleLabel: ="AI Requirement Analyzer"
                              Color: =RGBA(255, 255, 255, 1)
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Semibold
                              Height: =42
                              LayoutMinWidth: =96
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
