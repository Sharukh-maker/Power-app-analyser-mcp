                                    Text: "=If(\n  CountRows(colRequirementDocuments) = 0,\n  \"No requirements have been saved on this device yet.\",\n  \"LOCAL REQUIREMENTS (\" & CountRows(colRequirementDocuments) & \")\" & Char(10) &\n  Concat(\n    FirstN(colRequirementDocuments, 5),\n    ProjectName & \" — \" & SourceType & Char(10)\n  ) &\n  Char(10) & \"Generated stories: \" & CountRows(colUserStories) &\n  \" | Test-case drafts: \" & CountRows(colTestCases) &\n  \" | Jira drafts not sent: \" & CountRows(colJiraDrafts)\n)"
                                    VerticalAlign: =VerticalAlign.Top
                                    Width: =Parent.Width
