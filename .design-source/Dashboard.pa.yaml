                  Fill: =varSidebarFill
                  FillPortions: =0
                  Height: =Parent.Height
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =20
                  LayoutMinHeight: =300
                  LayoutMinWidth: =If(App.Width < 720, 0, 232)
                  PaddingBottom: =20
                  PaddingLeft: =16
                  PaddingRight: =16
                  PaddingTop: =18
                  Visible: =App.Width >= 720
                  Width: =If(App.Width < 720, 0, 232)
