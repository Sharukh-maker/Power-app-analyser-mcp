                              Align: =Align.Center
                              Color: =RGBA(255, 255, 255, 1)
                              Fill: =varBrandBlue
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Bold
                              Height: =36
                              LayoutMinWidth: =36
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
