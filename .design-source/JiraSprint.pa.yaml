                                          VerticalAlign: =VerticalAlign.Middle
                                          Width: =Parent.Width
                                    - JiraSprintHeaderUserEmail:
                                        Control: ModernText
                                        Properties:
                                          AccessibleLabel: ="Current user email"
                                          Color: =varTextSecondary
                                          Font: =Font.'Segoe UI'
                                          Height: =20
                                          LayoutMinWidth: =96
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                          PaddingTop: =0
                                          Size: =11
                                          Text: =User().Email
                                          VerticalAlign: =VerticalAlign.Middle
                                          Width: =Parent.Width
                              - JiraSprintHeaderUserAvatar:
                                  Control: ModernAvatar
                                  Properties:
                                    AccessibleLabel: ="Current user profile image"
                                    Appearance: =AvatarColor.Brand
                                    Image: =User().Image
                                    Name: =User().FullName
                                    Height: =42
                                    Shape: =AvatarShape.Circular
                                    Tooltip: =User().FullName
                                    Width: =42
                  - JiraNav:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        Fill: =varSidebarFill
                        FillPortions: =0
                        Height: =If(App.Width < 440, 104, 64)
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =8
                        LayoutMinHeight: =If(App.Width < 440, 104, 64)
                        LayoutMinWidth: =280
                        LayoutWrap: =true
                        PaddingLeft: =16
                        PaddingRight: =16
                        Visible: =App.Width < 720
                      Children:
                        - JiraBrandBadge:
                            Control: ModernText
                            Properties:
                              AccessibleLabel: ="jira brand badge"
                              Align: =Align.Center
                              Color: =RGBA(255, 255, 255, 1)
                              Fill: =varBrandBlue
                              FontWeight: =FontWeight.Bold
                              LayoutMinWidth: =96
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              RadiusBottomLeft: =0
                              RadiusBottomRight: =0
                              RadiusTopLeft: =0
                              RadiusTopRight: =0
                              Size: =13
