Screens:
  JiraSprint:
    Properties:
      Fill: =varCanvasFill
      LoadingSpinnerColor: =varBrandBlue
    Children:
      - JiraShell:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            Fill: =varCanvasFill
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Horizontal
            LayoutOverflowY: =LayoutOverflow.Scroll
            Width: =Parent.Width
            LayoutGap: =0
            LayoutOverflowX: =LayoutOverflow.Hide
          Children:
            - JiraSprintSidebar:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  Fill: =varSidebarFill
                  FillPortions: =0
                  Height: =Parent.Height
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =20
                  LayoutMinHeight: =300
                  LayoutMinWidth: =If(App.Width < 720, 0, 232)
                  PaddingBottom: =20
                  PaddingLeft: =16
                  PaddingRight: =16
                  PaddingTop: =18
                  Visible: =App.Width >= 720
                  Width: =If(App.Width < 720, 0, 232)
                Children:
                  - JiraSprintSidebarBrand:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        Fill: =varSidebarFill
                        FillPortions: =0
                        Height: =60
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =10
                        LayoutMinHeight: =56
                        LayoutMinWidth: =200
                      Children:
                        - JiraSprintSidebarBrandBadge:
                            Control: ModernText
                            Properties:
                              AccessibleLabel: ="AI Requirement Analyzer logo"
                              Align: =Align.Center
                              Color: =RGBA(255, 255, 255, 1)
                              Fill: =varBrandBlue
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Bold
                              Height: =36
                              LayoutMinWidth: =36
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              RadiusBottomLeft: =8
                              RadiusBottomRight: =8
                              RadiusTopLeft: =8
                              RadiusTopRight: =8
                              Size: =15
                              Text: ="AI"
                              VerticalAlign: =VerticalAlign.Middle
                              Width: =36
                        - JiraSprintSidebarBrandName:
                            Control: ModernText
                            Properties:
                              AccessibleLabel: ="AI Requirement Analyzer"
                              Color: =RGBA(255, 255, 255, 1)
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Semibold
                              Height: =42
                              LayoutMinWidth: =96
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =14
                              Text: ="AI Requirement Analyzer"
                              VerticalAlign: =VerticalAlign.Middle
                              Width: =Parent.Width - 52
                  - JiraSprintSidebarNavigation:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        Fill: =varSidebarFill
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =8
                        LayoutMinHeight: =240
                        LayoutMinWidth: =196
                      Children:
                        - JiraSprintSidebarUpload:
                            Control: ModernButton
                            Properties:
                              AccessibleLabel: ="Upload requirements"
                              Appearance: =ButtonAppearance.Subtle
                              BasePaletteColor: =varBrandBlue
                              Color: =RGBA(255, 255, 255, 1)
                              Height: =44
                              Icon: ="ArrowUpload"
                              RadiusBottomLeft: =12
                              RadiusBottomRight: =12
                              RadiusTopLeft: =12
                              RadiusTopRight: =12
                              Text: ="Upload requirements"
                              Width: =Parent.Width
                              OnSelect: =Navigate(Upload, ScreenTransition.Fade)
                        - JiraSprintSidebarReview:
                            Control: ModernButton
                            Properties:
                              AccessibleLabel: ="Review stories"
                              Appearance: =ButtonAppearance.Subtle
                              BasePaletteColor: =varBrandBlue
                              Color: =RGBA(255, 255, 255, 1)
                              Height: =44
                              Icon: ="CheckmarkCircle"
                              RadiusBottomLeft: =12
                              RadiusBottomRight: =12
                              RadiusTopLeft: =12
                              RadiusTopRight: =12
                              Text: ="Review stories"
                              Width: =Parent.Width
                              OnSelect: =Navigate(Review, ScreenTransition.Fade)
                        - JiraSprintSidebarJira:
                            Control: ModernButton
                            Properties:
                              AccessibleLabel: ="Jira & sprint"
                              Appearance: =ButtonAppearance.Primary
                              BasePaletteColor: =varBrandBlue
                              Color: =RGBA(255, 255, 255, 1)
                              Height: =44
                              Icon: ="Link"
                              RadiusBottomLeft: =12
                              RadiusBottomRight: =12
                              RadiusTopLeft: =12
                              RadiusTopRight: =12
                              Text: ="Jira & sprint"
                              Width: =Parent.Width
                              OnSelect: =Navigate(JiraSprint, ScreenTransition.Fade)
                        - JiraSprintSidebarDashboard:
                            Control: ModernButton
                            Properties:
                              AccessibleLabel: ="Dashboard"
                              Appearance: =ButtonAppearance.Subtle
                              BasePaletteColor: =varBrandBlue
                              Color: =RGBA(255, 255, 255, 1)
                              Height: =44
                              Icon: ="DataBarVertical"
                              RadiusBottomLeft: =12
                              RadiusBottomRight: =12
                              RadiusTopLeft: =12
                              RadiusTopRight: =12
                              Text: ="Dashboard"
                              Width: =Parent.Width
                              OnSelect: =Navigate(Dashboard, ScreenTransition.Fade)
            - JiraSprintMain:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  Fill: =varCanvasFill
                  FillPortions: =1
                  Height: =Parent.Height
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =0
                  LayoutMinHeight: =300
                  LayoutMinWidth: =If(App.Width < 720, 280, 480)
                  LayoutOverflowY: =LayoutOverflow.Scroll
                  Width: =Parent.Width
                Children:
                  - JiraSprintHeader:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        BorderColor: =varBorderColor
                        BorderThickness: =1
                        Fill: =varCardFill
                        FillPortions: =0
                        Height: =76
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =12
                        LayoutJustifyContent: =LayoutJustifyContent.SpaceBetween
                        LayoutMinHeight: =68
                        LayoutMinWidth: =260
                        PaddingBottom: =10
                        PaddingLeft: =If(App.Width < 720, 16, 24)
                        PaddingRight: =If(App.Width < 720, 16, 24)
                        PaddingTop: =10
                        Width: =Parent.Width
                      Children:
                        - JiraHeaderTitle:
                            Control: ModernText
                            Properties:
                              AccessibleLabel: ="Jira & sprint page heading"
                              Color: =varTextPrimary
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Semibold
                              Height: =40
                              LayoutMinWidth: =120
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =If(App.Width < 480, 15, 18)
                              Text: ="Jira & sprint"
                              VerticalAlign: =VerticalAlign.Middle
                              Width: =If(App.Width < 520, Parent.Width - 70, Parent.Width - 320)
                        - JiraSprintHeaderUserIdentity:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              FillPortions: =0
                              Height: =54
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =10
                              LayoutMinHeight: =48
                              LayoutMinWidth: =140
                            Children:
                              - JiraSprintHeaderUserText:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    FillPortions: =0
                                    Height: =48
                                    LayoutAlignItems: =LayoutAlignItems.End
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutGap: =0
                                    LayoutMinHeight: =44
                                    LayoutMinWidth: =If(App.Width < 640, 0, 160)
                                    Visible: =App.Width >= 640
                                    Width: =If(App.Width < 640, 0, 250)
                                  Children:
                                    - JiraSprintHeaderUserName:
                                        Control: ModernText
                                        Properties:
                                          AccessibleLabel: ="Current user name"
                                          Color: =varTextPrimary
                                          Font: =Font.'Segoe UI'
                                          FontWeight: =FontWeight.Semibold
                                          Height: =24
                                          LayoutMinWidth: =96
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                          PaddingTop: =0
                                          Size: =14
