                            Control: ModernButton
                            Properties:
                              AccessibleLabel: =If(App.Width < 720, "Open navigation drawer", "Collapse or expand navigation")
                              Appearance: =ButtonAppearance.Subtle
                              Height: =40
                              Icon: =If(App.Width < 720, "Navigation", "PanelLeft")
                              OnSelect: =If(App.Width < 720, Set(varMobileDrawerOpen, true), Set(varSidebarCollapsed, !Coalesce(varSidebarCollapsed, false)))
                              Text: =""
                              Tooltip: =If(App.Width < 720, "Open navigation", "Collapse or expand sidebar")
                              Width: =40
                        - HelpSupport_PageHeading:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              FillPortions: =1
                              Height: =50
                              LayoutAlignItems: =LayoutAlignItems.Start
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =2
                              LayoutMinHeight: =46
                              LayoutMinWidth: =150
                            Children:
                              - HelpSupport_PageTitle:
                                  Control: Text
                                  Properties:
                                    Text: ="Help & Support"
                                    FontColor: =RGBA(31, 41, 55, 1)
                                    Height: =28
                                    Size: =18
                                    Weight: =FontWeight.Semibold
                                    Width: =Parent.Width
                              - HelpSupport_Breadcrumb:
                                  Control: Text
                                  Properties:
                                    Text: ="Home / Help & Support"
                                    FontColor: =RGBA(107, 114, 128, 1)
                                    Height: =18
                                    Size: =10
                                    Width: =Parent.Width
                        - HelpSupport_HeaderAvatar:
                            Control: ModernAvatar
                            Properties:
                              AccessibleLabel: = "Profile image for " & User().FullName
                              Height: =40
                              Image: =User().Image
                              Name: =User().FullName
                              Width: =40
                  - HelpSupport_PageCard:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        Fill: =RGBA(255, 255, 255, 1)
                        FillPortions: =1
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =16
                        LayoutMinHeight: =240
                        LayoutMinWidth: =240
                        PaddingBottom: =24
                        PaddingLeft: =24
                        PaddingRight: =24
                        PaddingTop: =24
                        RadiusBottomLeft: =12
                        RadiusBottomRight: =12
                        RadiusTopLeft: =12
                        RadiusTopRight: =12
                        DropShadow: =DropShadow.Light
                      Children:
                        - HelpSupport_SectionTitle:
                            Control: Text
                            Properties:
                              Text: ="Help & Support"
                              FontColor: =RGBA(31, 41, 55, 1)
                              Height: =32
                              Size: =18
                              Weight: =FontWeight.Semibold
                              Width: =Parent.Width
                        - HelpSupport_SectionDescription:
                            Control: Text
                            Properties:
                              Text: ="Help & Support workspace. Connect a suitable business data source to display live help & support information here."
                              AutoHeight: =true
                              FontColor: =RGBA(107, 114, 128, 1)
                              Height: =56
                              Size: =13
                              Width: =Parent.Width
                        - HelpSupport_BackToDashboard:
                            Control: ModernButton
                            Properties:
                              AccessibleLabel: ="Return to Dashboard"
                              Appearance: =ButtonAppearance.Secondary
                              Height: =40
                              Icon: ="Home"
                              OnSelect: =Navigate(Dashboard, ScreenTransition.Fade)
                              Text: ="Back to Dashboard"
                              Width: =170
