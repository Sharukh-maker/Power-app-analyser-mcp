Screens:
  Dashboard:
    Properties:
      Fill: =RGBA(245, 247, 250, 1)
      LoadingSpinnerColor: =RGBA(21, 101, 192, 1)
    Children:
      - DBPageShell:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            Fill: =RGBA(245, 247, 250, 1)
            Height: =Parent.Height
            Width: =Parent.Width
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Horizontal
            LayoutGap: =0
            LayoutMinWidth: =300
          Children:
            - DBSidebar:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  Fill: =RGBA(17, 31, 53, 1)
                  FillPortions: =0
                  Height: =Parent.Height
                  Width: =If(App.Width < 720, 280, If(Coalesce(varSidebarCollapsed, false), 72, 252))
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =12
                  LayoutMinHeight: =300
                  LayoutMinWidth: =If(App.Width < 720, 280, 72)
                  LayoutOverflowY: =LayoutOverflow.Scroll
                  PaddingBottom: =16
                  PaddingLeft: =10
                  PaddingRight: =10
                  PaddingTop: =16
                  Visible: =App.Width >= 720 || Coalesce(varMobileDrawerOpen, false)
                Children:
                  - DBSidebarBrand:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        FillPortions: =0
                        Height: =48
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =8
                        LayoutJustifyContent: =LayoutJustifyContent.SpaceBetween
                        LayoutMinHeight: =44
                        LayoutMinWidth: =48
                      Children:
                        - DBBrandBadge:
                            Control: Text
                            Properties:
                              Text: ="B"
                              Align: =Align.Center
                              Fill: =RGBA(21, 101, 192, 1)
                              FontColor: =RGBA(255, 255, 255, 1)
                              Height: =36
                              Size: =16
                              Weight: =FontWeight.Bold
                              Width: =36
                        - DBSidebarAppName:
                            Control: Text
                            Properties:
                              Text: =If(Coalesce(varSidebarCollapsed, false), "", "Business Dashboard")
                              FontColor: =RGBA(255, 255, 255, 1)
                              Height: =32
                              Size: =14
                              Weight: =FontWeight.Semibold
                              Width: =If(Coalesce(varSidebarCollapsed, false), 0, 160)
                              Visible: =!Coalesce(varSidebarCollapsed, false)
                        - DBCollapseSidebar:
                            Control: ModernButton
                            Properties:
                              AccessibleLabel: =If(App.Width < 720, "Close navigation drawer", "Collapse or expand navigation")
                              Appearance: =ButtonAppearance.Subtle
                              Height: =36
                              Icon: =If(App.Width < 720, "Dismiss", "PanelLeft")
                              OnSelect: =If(App.Width < 720, Set(varMobileDrawerOpen, false), Set(varSidebarCollapsed, !Coalesce(varSidebarCollapsed, false)))
                              Text: =If(App.Width < 720 || Coalesce(varSidebarCollapsed, false), "", "Collapse")
                              Tooltip: =If(App.Width < 720, "Close navigation", "Collapse or expand sidebar")
                              Visible: =App.Width < 720 || !Coalesce(varSidebarCollapsed, false)
                              Width: =If(App.Width < 720 || !Coalesce(varSidebarCollapsed, false), 86, 36)
                  - DBNavigationList:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        FillPortions: =1
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =4
                        LayoutMinHeight: =180
                        LayoutMinWidth: =48
                        LayoutOverflowY: =LayoutOverflow.Scroll
                      Children:
                        - DBNavDashboard:
                            Control: ModernButton
                            Properties:
                              AccessibleLabel: ="Dashboard"
                              Appearance: =ButtonAppearance.Primary
                              Height: =36
                              Icon: ="Home"
                              OnSelect: =Navigate(Dashboard, ScreenTransition.Fade)
                              Text: =If(Coalesce(varSidebarCollapsed, false), "", "Dashboard")
                              Tooltip: ="Dashboard"
                              Width: =Parent.Width
                        - DBAnalyticsNavRow:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              FillPortions: =0
                              Height: =36
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =2
                              LayoutMinHeight: =36
                              LayoutMinWidth: =48
                            Children:
                              - DBNavAnalytics:
                                  Control: ModernButton
                                  Properties:
                                    AccessibleLabel: ="Analytics"
                                    Appearance: =ButtonAppearance.Subtle
                                    Height: =36
                                    Icon: ="DataBarVertical"
                                    OnSelect: =Navigate(Analytics, ScreenTransition.Fade)
                                    Text: =If(Coalesce(varSidebarCollapsed, false), "", "Analytics")
                                    Tooltip: ="Analytics"
                                    Width: =Parent.Width - 38
                              - DBAnalyticsExpand:
                                  Control: ModernButton
                                  Properties:
                                    AccessibleLabel: ="Expand or collapse Analytics submenu"
                                    Appearance: =ButtonAppearance.Subtle
                                    Height: =34
                                    Icon: =If(Coalesce(varAnalyticsOpen, false), "ChevronDown", "ChevronRight")
                                    IconRotation: =If(Coalesce(varAnalyticsOpen, false), 180, 0)
                                    OnSelect: =Set(varAnalyticsOpen, !Coalesce(varAnalyticsOpen, false))
                                    Text: =""
                                    Tooltip: ="Toggle Analytics submenu"
                                    Width: =34
                        - DBAnalyticsSubmenu:
