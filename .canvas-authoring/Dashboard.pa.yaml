                                        Control: Text
                                        Properties:
                                          Align: =Align.Right
                                          FontColor: =RGBA(227, 242, 253, 1)
                                          Height: =18
                                          Size: =10
                                          Text: =User().Email
                                          Width: =Parent.Width
                              - UserAvatar:
                                  Control: ModernAvatar
                                  Properties:
                                    AccessibleLabel: ="Profile image for " & User().FullName
                                    Appearance: =AvatarColor.Blue
                                    Height: =42
                                    Image: =User().Image
                                    Name: =User().FullName
                                    Width: =42
                              - HeaderNotifications:
                                  Control: ModernButton
                                  Properties:
                                    AccessibleLabel: ="Notifications"
                                    Appearance: =ButtonAppearance.Subtle
                                    Height: =38
                                    Icon: ="Alert"
                                    OnSelect: =Notify("You have no new notifications.", NotificationType.Information)
                                    Text: =""
                                    Tooltip: ="Notifications"
                                    Width: =40
                              - ProfileMenu:
                                  Control: ModernButton
                                  Properties:
                                    AccessibleLabel: ="Profile menu for " & User().FullName
                                    Appearance: =ButtonAppearance.Secondary
                                    Height: =38
                                    OnSelect: =Notify("Signed in as " & User().Email, NotificationType.Information)
                                    Text: ="Profile"
                                    Tooltip: ="View signed-in account"
                                    Width: =76
