                                                      Format: =DatePickerFormat.Short
                                                      Height: =38
                                                      Width: =Parent.Width
                                          - StatusField:
                                              Control: GroupContainer
                                              Variant: AutoLayout
                                              Properties:
                                                FillPortions: =1
                                                LayoutMaxWidth: =If(Parent.Width >= 700, Parent.Width / 2, Parent.Width)
                                                LayoutAlignItems: =LayoutAlignItems.Stretch
                                                LayoutDirection: =LayoutDirection.Vertical
                                                LayoutGap: =6
                                                LayoutMinHeight: =82
                                                LayoutMinWidth: =280
                                              Children:
                                                - StatusLabel:
                                                    Control: Text
                                                    Properties:
                                                      FontColor: =RGBA(31, 41, 55, 1)
                                                      Height: =22
                                                      Size: =12
                                                      Text: ="Status *"
                                                      Weight: =FontWeight.Semibold
                                                      Width: =Parent.Width
                                                - StatusInput:
                                                    Control: ModernDropdown
                                                    Properties:
                                                      AccessibleLabel: ="Status, required"
                                                      Appearance: =Appearance.Outline
                                                      Default: '={Value: "New"}'
                                                      Height: =38
                                                      ItemDisplayText: =ThisItem.Value
                                                      Items: '=Table({Value: "New"}, {Value: "In Progress"}, {Value: "Completed"}, {Value: "Cancelled"})'
                                                      Required: =true
                                                      Width: =Parent.Width
                                          - DescriptionField:
                                              Control: GroupContainer
                                              Variant: AutoLayout
