                            Variant: AutoLayout
                            Properties:
                              FillPortions: =0
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =2
                              LayoutMinHeight: =0
                              LayoutMinWidth: =48
                              Visible: =!Coalesce(varSidebarCollapsed, false) && (Coalesce(varAnalyticsOpen, false) || false)
                            Children:
                              - DBNavAnalyticsOverview:
                                  Control: ModernButton
                                  Properties:
                                    AccessibleLabel: ="Overview"
                                    Appearance: =ButtonAppearance.Subtle
                                    Height: =36
                                    Icon: ="ViewDashboard"
                                    OnSelect: =Navigate(AnalyticsOverview, ScreenTransition.Fade)
                                    PaddingLeft: =24
