                                        Control: ModernButton
                                        Properties:
                                          AccessibleLabel: ="Validate and submit dashboard information"
                                          Appearance: =ButtonAppearance.Primary
                                          Height: =40
                                          OnSelect: '=If(IsBlank(Trim(DepartmentInput.Text)) || IsBlank(Trim(DescriptionInput.Text)) || IsBlank(StatusInput.Selected.Value), Notify("Complete the required fields: Department, Status, and Description.", NotificationType.Error), Notify("Required fields are valid, but no data source is connected. Connect a data source to save this record.", NotificationType.Warning))'
                                          Text: ="Submit"
                                          Width: =112
                                    - SaveDraftButton:
                                        Control: ModernButton
                                        Properties:
                                          AccessibleLabel: ="Save dashboard information as a draft"
                                          Appearance: =ButtonAppearance.Secondary
                                          Height: =40
                                          OnSelect: =Notify("Drafts cannot be saved until a data source is connected.", NotificationType.Information)
                                          Text: ="Save Draft"
                                          Width: =116
                                    - ClearButton:
