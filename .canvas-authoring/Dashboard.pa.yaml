                                                    Control: Text
                                                    Properties:
                                                      FontColor: =RGBA(31, 41, 55, 1)
                                                      Height: =22
                                                      Size: =12
                                                      Text: ="Description *"
                                                      Weight: =FontWeight.Semibold
                                                      Width: =Parent.Width
